services:
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./.cache/huggingface:/root/.cache/huggingface:rw
    environment:
      - LLAMA_CACHE=/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "-hf"
      - "unsloth/Qwen3.6-27B-GGUF:UD-Q6_K_XL"
      - "-ngl"
      - "99"
      - "--ctx-size"
      - "90000"
      - "--temp"
      - "0.6"
      - "--top-p"
      - "0.95"
      - "--top-k"
      - "20"
      - "--min-p"
      - "0.0"
      - "--presence_penalty"
      - "0.0"
      - "--cache-type-k"
      - "bf16"
      - "--cache-type-v"
      - "bf16"
      - "--kv-unified"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--chat-template-kwargs"
      - '{"enable_thinking":true, "preserve_thinking":true}'
